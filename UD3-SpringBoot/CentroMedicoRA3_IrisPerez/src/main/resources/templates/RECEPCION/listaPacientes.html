<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Listado Pacientes (Recepción)</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/templates.css">
</head>
<body class="bg-dark text-light mt-4">

<div class="container-fluid p-5">
    <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-4 px-2">
        <div>
            <h2 class="mb-0 text-gradient-primary">Lista de pacientes</h2>
        </div>
        <div class="d-flex gap-3">
            <a href="/killSession" class="btn btn-outline-gradient-primary px-4">Salir</a>
        </div>
    </div>

    <div id="recuadroAlert" class="alert alert-danger d-none" role="alert"></div>

    <div class="card shadow-lg rounded-4 bg-dark text-light text-center">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellidos</th>
                        <th>DNI</th>
                        <th>Teléfono</th>
                        <th>Fecha Nacimiento</th>
                        <th>Historial</th>
                        <th>Médico</th>
                        <th>Estado</th>
                        <th>Fecha Creación</th>
                    </tr>
                    </thead>
                    <tbody id="tBodyPacientes"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="/js/listaPacientes.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootbox@5/dist/bootbox.min.js"></script>

</body>
</html>
