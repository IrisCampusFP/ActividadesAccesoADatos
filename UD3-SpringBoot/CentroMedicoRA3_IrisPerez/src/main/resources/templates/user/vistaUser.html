<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Página de bienvenida usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/vistaUser.css">
</head>
<body class="bg-dark text-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
            <div class="card shadow-lg rounded-4 bg-dark text-light p-5">
                <div class="mb-4">
                    <h2 class="text-gradient-primary mb-0 text-center">Bienvenid@, <span id="nombreUsuario" class="user-name">usuario</span> :)</h2>
                </div>

                <div>
                    <p class="text-center text-secondary fs-5">Estos son tus datos</p>

                    <div id="datosUsuario" class="table-responsive">
                        <!-- Aquí se cargará la tabla con los datos del usuario mediante JS -->
                    </div>

                    <div class="text-center mt-4">
                        <a href="/killSession" class="btn btn-gradient-primary btn-lg px-5">Cerrar sesión</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="js/vistaUser.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
