
# ==========================================
# CONFIGURACIÓN DE CONEXIÓN A BASE DE DATOS
# ==========================================

# ------------------------------------
# Configuración del DataSource MySQL
# ------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/login_v2?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------
# Configuración de JPA / Hibernate
# ------------------------------------

# Mostrar las consultas SQL en consola (útil para depuración)
spring.jpa.show-sql=true
# Formatear las consultas SQL para mejor legibilidad
spring.jpa.properties.hibernate.format_sql=true

# Estrategia de generación del esquema:
# - none: No hace nada (producción)
# - validate: Valida el esquema pero no lo modifica
# - update: Actualiza el esquema si es necesario
# - create: Crea el esquema, destruyendo datos previos
# - create-drop: Crea al inicio y elimina al cerrar
spring.jpa.hibernate.ddl-auto=validate

# ------------------------------------
# Configuración del Pool de Conexiones
# (HikariCP - incluido por defecto)
# ------------------------------------
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ------------------------------------
# Spring Session (sesiones en BD)
# ------------------------------------
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always

# ------------------------------------
# Nombre de la aplicación
# ------------------------------------
spring.application.name=LoginV2_IrisPerez